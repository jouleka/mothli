name: Deployment

# Builds both images from deploy/Dockerfile and starts the real deploy/compose.yaml, as the
# runbook does on the server, with deploy/compose.local.yaml in place of the Cloudflare tunnel:
# first with both AI keys empty and Paddle off, then with Paddle on, then with the AI keys in and
# the worker on. The settings are made by deploy/setup.sh with made-up values that are not
# secret. Nothing here can reach a real sign-in service, Paddle, R2 or Cloudflare.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # -e and pipefail: a failure anywhere in a pipe fails the step.
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: deploy/compose.yaml:deploy/compose.local.yaml
      COMPOSE_PROJECT_NAME: mothli-smoke
      DOMAIN: reader.example.org
      PROXY: http://127.0.0.1:18741
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make the settings with deploy/setup.sh
        run: |
          deploy/setup.sh --no-prompt --domain "$DOMAIN" \
            --oidc-issuer https://issuer.example.org/ --oidc-client-id smoke-client \
            --operator-name "Smoke Test Operator" --operator-country Testland \
            --operator-email contact@example.org --paddle-environment sandbox \
            --paddle-price-monthly pri_aaaaaaaaaaaaaaaaaaaaaaaaaa \
            --paddle-price-yearly pri_bbbbbbbbbbbbbbbbbbbbbbbbbb \
            --r2-endpoint https://r2.example.org
          test "$(stat -c %a deploy/.env)" = 600 && test "$(stat -c %a deploy/app.env)" = 600
          # The two values the owner pastes are named, and nothing may start yet.
          if deploy/setup.sh check > check.txt; then echo "check passed too early"; exit 1; fi
          grep -q CLOUDFLARE_TUNNEL_TOKEN check.txt && grep -q OIDC_CLIENT_SECRET check.txt
          # No value the script made, nor any 12 characters of one, is in what it printed.
          grep -hE '^[A-Z_]*(PASSWORD|FILESYSTEM_KEY)=' deploy/.env deploy/app.env | cut -d= -f2- \
            | while IFS= read -r v; do if grep -qF "${v:8:12}" check.txt; then echo "a value was printed"; exit 1; fi; done
          # The owner's pasting, with stand-ins (the tunnel's shaped like Cloudflare's token).
          echo "eyJhIjoi$(printf 'smoke%.0s' $(seq 1 20))fQ==" | deploy/setup.sh set CLOUDFLARE_TUNNEL_TOKEN
          echo "smoke-client-stand-in" | deploy/setup.sh set OIDC_CLIENT_SECRET
          deploy/setup.sh check
          # Running it again changes nothing.
          sha256sum deploy/.env deploy/app.env > before.sum
          deploy/setup.sh --no-prompt
          sha256sum -c --quiet before.sum
          deploy/setup.sh cron --show
          rm -f check.txt before.sum
          # The crontab's wrapper, with the watch settings still empty: the job's exit status
          # passes through and nothing is reported.
          deploy/report.sh backup -- true
          set +e
          deploy/report.sh backup -- false
          code=$?
          set -e
          test "$code" = 1

      - name: Build both images
        run: docker compose build

      - name: Start the stack (no tunnel, no AI keys)
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check it through the proxy
        run: |
          get() { curl -sS --max-time 20 -H "Host: $DOMAIN" "$@"; }
          echo "ready:"; get --fail "$PROXY/api/health/ready" | tee ready.json; echo
          grep -q '"status":"ready"' ready.json
          # The five public addresses as a program reads them (no JavaScript): real words, the
          # links to the policies, and the operator's name in the terms; no prices without Paddle.
          has() { grep -qF "$2" "$1" || { echo "$1 lacks: $2"; exit 1; }; }
          for page in "" terms privacy refunds contact; do
            code=$(get -o "page-$page.html" -w '%{http_code}' "$PROXY/$page")
            echo "/$page: $code"
            test "$code" = 200
            # The page written into the root: the front page's own (public/landing), the others'.
            if [ -z "$page" ]; then wrapper='id="root"><div class="lp">'; else wrapper='id="root"><div class="mothli-library'; fi
            has "page-$page.html" "$wrapper"
            for link in terms privacy refunds contact; do has "page-$page.html" "<a href=\"/$link\">"; done
            if grep -q '@@' "page-$page.html"; then echo "/$page has a placeholder"; exit 1; fi
          done
          has page-.html 'Read with a friend in the margin.'
          has page-.html 'so it can never spoil what happens next.'
          has page-.html 'You’ll see the prices when you choose.'
          has page-.html 'who sells Mothli on our behalf.'
          has page-.html 'Mothli is run by Smoke Test Operator.'
          if grep -q 'billed yearly' page-.html; then echo "a price without Paddle"; exit 1; fi
          has page-terms.html 'Mothli is run by Smoke Test Operator, based in Testland'
          has page-terms.html '<h2>Paying for the plan</h2>'
          has page-terms.html 'mailto:contact@example.org'
          has page-privacy.html '<h2>How long we keep it</h2>'
          has page-refunds.html 'Refunds are decided by Paddle'
          has page-contact.html 'Smoke Test Operator, based in Testland.'
          # A signed-in reader's request is the app's own page, from the proxy, as before.
          get --fail -o home.html -H "Cookie: __Host-litlet-session=smoke" "$PROXY/"
          grep -qi '<!doctype html' home.html && grep -q '<div id="root"></div>' home.html
          echo "site:"; get --fail "$PROXY/api/site"; echo
          # The proxy's own security headers on a static response.
          get -D headers.txt -o /dev/null "$PROXY/"
          cat headers.txt
          for header in "content-security-policy: default-src 'self'" \
                        "x-content-type-options: nosniff" "referrer-policy: no-referrer" \
                        "x-frame-options: SAMEORIGIN" "permissions-policy: camera=()"; do
            grep -qiF "$header" headers.txt || { echo "missing: $header"; exit 1; }
          done
          if grep -qi '^server:' headers.txt; then echo "the Server header is shown"; exit 1; fi
          # An unknown API address is the backend's JSON 404, never the app's page.
          code=$(get -D api404.txt -o api404.json -w '%{http_code}' "$PROXY/api/no-such-thing")
          echo "/api/no-such-thing: $code"; cat api404.json; echo
          test "$code" = 404
          grep -qi '^content-type: application/json' api404.txt
          if grep -qi '<html' api404.json; then echo "the app's page, not the backend's 404"; exit 1; fi

      - name: The worker refuses to start without the AI keys
        run: |
          if timeout 180 docker compose run --rm --no-deps -T worker > worker.txt 2>&1; then
            cat worker.txt; echo "the worker started without AI keys"; exit 1
          fi
          tail -n 5 worker.txt
          grep -q "the companion dispatcher needs READER_CONVERSATION_JEV" worker.txt

      - name: The command-line tools, the purge and the Paddle check
        run: |
          docker compose run --rm --no-deps -T tools
          deploy/report.sh purge -- docker compose run --rm --no-deps -T purge | tee purge.txt
          grep -q '^erased 0, unfinished 0, held 0, waiting 0; editions erased 0, unfinished 0, waiting 0$' purge.txt
          # The crontab's hourly line, before Paddle is set up: it stops at once and says why.
          set +e
          deploy/report.sh paddle-check -- docker compose exec -T web python -m app.hosted.paddle_check > paddle.txt 2>&1
          code=$?
          set -e
          cat paddle.txt
          test "$code" = 2
          grep -q "PADDLE_API_KEY and HOSTED_BILLING_DSN are required" paddle.txt

      - name: The backup key and a backup up to the upload
        run: |
          deploy/setup.sh backup-key
          deploy/setup.sh backup-key > again.txt
          grep -q "already set" again.txt
          # R2 is a made-up address here: everything before the upload must work, the upload not.
          set +e
          MOTHLI_COMPOSE="docker compose" deploy/backup.sh > backup.txt 2>&1
          code=$?
          set -e
          cat backup.txt
          test "$code" != 0
          grep -q "BACKUP FAILED while uploading to R2" backup.txt
          ls deploy/backups/mothli-backup-*.tar.age

      # The live server on 25 November 2026: Paddle switched on in app.env, and the 04:00 purge
      # stopped on "Paddle's messages require HOSTED_BILLING_DSN". From here every service and
      # scheduled command runs again with Paddle on, pasted as the owner pastes it. The values are
      # made up, shaped like sandbox ones (never a live key), and nothing here reaches Paddle.
      - name: Turn Paddle on, as the owner did, and restart
        run: |
          repeat() { printf "$1%.0s" $(seq 1 "$2"); }
          echo "pdl_ntfset_$(repeat smokestandin 3)" | deploy/setup.sh set PADDLE_WEBHOOK_SECRET
          echo "pdl_sdbx_apikey_$(repeat smokestandin 4)" | deploy/setup.sh set PADDLE_API_KEY
          echo "test_$(repeat smokestandin 2)" | deploy/setup.sh set PADDLE_CLIENT_TOKEN
          deploy/setup.sh check
          grep -q '^PADDLE_CHECKOUT_URL=https://reader.example.org/$' deploy/app.env
          docker compose up -d --wait --wait-timeout 300
          get() { curl -sS --max-time 20 -H "Host: $DOMAIN" "$@"; }
          get --fail "$PROXY/api/health/ready"; echo
          # Paddle's messages now have their address on the web process: an unsigned one is refused.
          code=$(get -o /dev/null -w '%{http_code}' -X POST --data '{}' "$PROXY/api/billing/paddle")
          echo "/api/billing/paddle: $code"
          test "$code" = 400

      - name: With Paddle on, every service and scheduled command starts
        run: |
          # The worker, before the AI keys: it stops only for the documented reason.
          if timeout 180 docker compose run --rm --no-deps -T worker > worker.txt 2>&1; then
            cat worker.txt; echo "the worker started without AI keys"; exit 1
          fi
          tail -n 5 worker.txt
          grep -q "the companion dispatcher needs READER_CONVERSATION_JEV" worker.txt
          if grep -q "ValidationError" worker.txt; then echo "the worker refused its settings"; exit 1; fi
          docker compose run --rm --no-deps -T tools
          # The crontab's three lines, through deploy/report.sh as the crontab runs them.
          deploy/report.sh purge -- docker compose run --rm --no-deps -T purge | tee purge.txt
          grep -q '^erased 0, unfinished 0, held 0, waiting 0; editions erased 0, unfinished 0, waiting 0$' purge.txt
          # No plan is stored, so it asks Paddle nothing: past its settings, it checks none.
          deploy/report.sh paddle-check -- docker compose exec -T web python -m app.hosted.paddle_check | tee paddle.txt
          grep -q '^checked 0, changed 0, failed 0$' paddle.txt
          deploy/setup.sh backup-key > again.txt
          grep -q "already set" again.txt
          set +e
          deploy/report.sh backup -- env MOTHLI_COMPOSE="docker compose" deploy/backup.sh > backup.txt 2>&1
          code=$?
          set -e
          cat backup.txt
          test "$code" != 0
          grep -q "BACKUP FAILED while uploading to R2" backup.txt
          # The database step, as every start runs it.
          docker compose run --rm -T migrate

      - name: With Paddle on and the AI keys in, the worker runs
        run: |
          # The owner's next step: both AI keys, then deploy/setup.sh worker on. Stand-ins; with
          # no reader there is no job, so nothing is sent to any AI provider.
          echo "sk-smoke-stand-in" | deploy/setup.sh set OPENAI_API_KEY
          echo "ts-smoke-stand-in" | deploy/setup.sh set TYPESAFE_API_KEY
          deploy/setup.sh worker on
          deploy/setup.sh check
          docker compose run --rm --no-deps -T worker python -m app.hosted.worker --once
          docker compose up -d --wait --wait-timeout 300
          sleep 20
          docker compose logs --no-color worker | tail -n 20
          test "$(docker compose ps --format '{{.State}}' worker)" = running
          if docker compose logs --no-color worker | grep -qE "Traceback|ValidationError"; then
            echo "the worker stopped"; exit 1
          fi
          get() { curl -sS --max-time 20 -H "Host: $DOMAIN" "$@"; }
          get --fail "$PROXY/api/health/ready"; echo

      - name: Without the backend, the public pages are the app's own page
        run: |
          docker compose stop web
          for page in "" terms; do
            curl -sS --max-time 20 -H "Host: $DOMAIN" -o fallback.html "$PROXY/$page"
            grep -q '<div id="root"></div>' fallback.html || { echo "/$page: no fallback"; exit 1; }
          done

      - name: Show what went wrong
        if: failure()
        run: |
          docker compose ps -a
          for service in $(docker compose config --services); do
            echo "==== $service"
            docker compose logs --no-color --tail 200 "$service" || true
          done

      - name: Stop and remove everything
        if: always()
        run: docker compose down --volumes --remove-orphans
