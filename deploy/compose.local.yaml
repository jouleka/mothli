# For trying the whole stack on one machine, never on the server:
#   docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml -p mothli-local up -d
# The proxy and the database are published on 127.0.0.1 only, and the Cloudflare tunnel is not
# started (CLOUDFLARE_TUNNEL_TOKEN may then be any placeholder). Sign-in cannot work locally: the
# app's sign-in address must be HTTPS and reachable.
services:
  db:
    ports: ["127.0.0.1:${MOTHLI_LOCAL_DB_PORT:-55741}:5432"]
    networks: [local]
  proxy:
    ports: ["127.0.0.1:${MOTHLI_LOCAL_PORT:-18741}:8080"]
    networks:
      local: {}
  tunnel:
    profiles: [never]

networks:
  local: {}
